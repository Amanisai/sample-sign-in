<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Moonlit Symphony — Polished</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#030414;
      --bg2:#081428;
      --gold-1:#ffe8c8;
      --gold-2:#ffd29a;
      --ink: rgba(255,250,245,0.98);
      --ink-glow: rgba(255,230,150,0.78);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      height:100vh;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      overflow:hidden;
      color: #fff;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }

    /* AURORA BANDS (improved motion) */
    .aurora { position:absolute; inset:0; pointer-events:none; z-index:0; }
    .aurora .band{
      position:absolute; width:180%; height:44%; left:-40%; filter: blur(36px) saturate(125%);
      opacity:0.12; transform-origin:center; mix-blend-mode: screen;
    }
    .aurora .band.b1 { top:6%; animation: auramove 16s ease-in-out infinite; }
    .aurora .band.b2 { top:30%; opacity:0.09; filter: blur(48px) saturate(135%); animation: auramove 18s ease-in-out infinite reverse; }
    .aurora .band.b3 { top:52%; opacity:0.06; filter: blur(56px) saturate(115%); animation: auramove 20s ease-in-out infinite; }

    .band .g {
      width:100%; height:100%;
      background:
        radial-gradient(40% 50% at 20% 45%, rgba(120,180,255,0.78), rgba(0,0,0,0) 36%),
        radial-gradient(52% 50% at 72% 60%, rgba(250,200,140,0.62), rgba(0,0,0,0) 42%);
      transform: rotate(-7deg);
      opacity:1;
    }
    .band.b2 .g { background:
      radial-gradient(40% 50% at 40% 30%, rgba(170,120,255,0.72), rgba(0,0,0,0) 36%),
      radial-gradient(52% 50% at 70% 70%, rgba(120,220,240,0.58), rgba(0,0,0,0) 42%); }
    .band.b3 .g { background:
      radial-gradient(40% 50% at 60% 40%, rgba(220,160,240,0.6), rgba(0,0,0,0) 34%),
      radial-gradient(50% 40% at 30% 70%, rgba(170,220,200,0.36), rgba(0,0,0,0) 44%); }

    @keyframes auramove {
      0% { transform: translateX(-7%) rotate(-1deg) scale(1); }
      50% { transform: translateX(7%) rotate(1.2deg) scale(1.02); }
      100% { transform: translateX(-7%) rotate(-1deg) scale(1); }
    }

    /* MOON — now with halo + drift */
    .moon-wrap { position:absolute; left:48px; top:44px; width:220px; height:220px; pointer-events:none; z-index:1; }
    .moon {
      position:absolute; left:0; top:0; width:160px; height:160px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #fff9e6 0%, #dfeeff 56%, rgba(200,220,255,0.06) 100%);
      filter: blur(0.6px);
      box-shadow: 0 30px 90px rgba(140,160,255,0.06), inset 0 -8px 24px rgba(255,230,200,0.06);
      mix-blend-mode: screen;
      transform-origin:center;
      animation: moonfloat 10s ease-in-out infinite, moontravel 28s linear infinite;
      margin-left:24px; margin-top:12px;
    }
    .moon::after {
      content:"";
      position:absolute; inset:0; border-radius:50%;
      box-shadow:0 0 48px rgba(255,230,200,0.08), 0 0 140px rgba(160,180,255,0.05);
      pointer-events:none;
    }
    @keyframes moonfloat {
      0% { transform: translateY(0) scale(1); filter:brightness(.98) blur(.6px) }
      50% { transform: translateY(-18px) scale(1.05); filter:brightness(1.12) blur(1.6px) }
      100% { transform: translateY(0) scale(1); filter:brightness(.98) blur(.6px) }
    }
    @keyframes moontravel {
      0% { left:-100px; }
      50% { left:calc(50vw - 80px); }
      100% { left:calc(100vw + 20px); }
    }

    /* subtle moving cloud silhouette (SVG below) */
    .clouds { position:absolute; inset:0; pointer-events:none; z-index:0; opacity:0.06; filter: blur(2px); }

    /* STARS (JS-generated) */
    .star { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; filter: blur(0.6px); opacity:0.9; z-index:0; }

    /* CENTER CARD -------------------------------------------------- */
    .center {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:30px; z-index:2;
    }
    .card {
      position:relative;
      width:420px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
      border-radius:18px;
      padding:28px 28px 36px 28px;
      border: 1px solid rgba(255,220,150,0.06);
      backdrop-filter: blur(10px);
      box-shadow: 0 22px 70px rgba(3,8,20,0.72);
      overflow:visible;
    }

    .card h1 { margin:0; font-size:26px; font-weight:700; letter-spacing:0.2px; font-family: 'Dancing Script', cursive; color: #fff9e6; text-shadow:0 6px 18px rgba(0,0,0,0.55);}
    .card p.lead { margin:8px 0 18px; color:rgba(255,255,255,0.78); font-size:13px; font-weight:500; }

    .field { position:relative; margin-bottom:12px; }
    .label { font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:6px; display:block; }
    .real-input {
      width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.028); color:transparent; /* hide native text so ink layer shows */
      caret-color: transparent; /* hide native caret (prevents double-cursor) */
      position:relative; z-index:2; font-size:16px; outline:none;
      -webkit-text-fill-color: transparent; -moz-text-fill-color: transparent;
    }

    /* ink layer (rendering the visible handwriting) */
    .ink-display {
      position:absolute; left:12px; top:36px; right:12px; pointer-events:none;
      font-family: 'Dancing Script', cursive; font-size:18px; color:var(--ink);
      text-shadow: 0 6px 18px rgba(0,0,0,0.6), 0 0 16px var(--ink-glow);
      z-index:3;
      white-space:nowrap; overflow:hidden;
    }
    .ink-display .caret {
      display:none; width:2px; height:22px; background:var(--ink); margin-left:2px;
      vertical-align:middle; opacity:0.95; animation: blink 1s steps(1) infinite;
      box-shadow: 0 0 10px var(--ink-glow);
    }
    
    .field:focus-within .ink-display .caret {
      display:inline-block;
    }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }

    /* quill icon */
    .quill { position:absolute; right:-28px; top:-28px; width:86px; height:86px; pointer-events:none; transform-origin:center; opacity:0.96; z-index:3; }
    .quill svg { width:100%; height:100% }

    /* button */
    .actions { margin-top:14px; display:flex; gap:12px; align-items:center; justify-content:space-between;}
    .btn {
      padding:12px 14px; border-radius:10px; border:none; font-weight:700; cursor:pointer;
      background: linear-gradient(90deg, var(--gold-1), var(--gold-2));
      color:#000; box-shadow:0 8px 18px rgba(0,0,0,0.45);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn:active { transform:translateY(1px) scale(.997) }
    .btn:hover { transform:scale(1.02); box-shadow:0 18px 40px rgba(0,0,0,0.55) }

    .ghost { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.92); border:1px solid rgba(255,255,255,0.04); }

    /* bottom water canvas */
    #water { position:absolute; left:0; right:0; bottom:0; height:160px; display:block; z-index:1; }

    /* moonbeam for success */
    .moonbeam { position:absolute; inset:0; pointer-events:none; display:flex; align-items:flex-start; justify-content:center; opacity:0; z-index:4; }
    .moonbeam .beam {
      width:60%; height:260px; margin-top:90px; background: linear-gradient(180deg, rgba(255,255,230,0.24), rgba(255,255,255,0.02));
      transform:skewY(-6deg); border-radius:18px; filter: blur(20px);
      box-shadow: 0 40px 160px rgba(255,240,200,0.16);
    }

    /* particles layer (above everything) */
    .particles { position:absolute; left:0; top:0; right:0; bottom:0; pointer-events:none; z-index:3; }

    /* responsive tweaks */
    @media (max-width:480px){
      .card{ width:92%; padding:20px; }
      .quill{ display:none }
      .moon-wrap{ left:10px; top:12px; }
    }
  </style>
</head>
<body>

  <!-- Aurora bands -->
  <div class="aurora" aria-hidden="true">
    <div class="band b1"><div class="g"></div></div>
    <div class="band b2"><div class="g"></div></div>
    <div class="band b3"><div class="g"></div></div>
  </div>

  <!-- slow clouds (SVG, moves subtly) -->
  <div class="clouds" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="width:120%;height:100%;">
      <g id="cloudGroup" opacity="0.06" fill="#ffffff">
        <ellipse cx="350" cy="220" rx="420" ry="86"/>
        <ellipse cx="1100" cy="180" rx="520" ry="100"/>
        <ellipse cx="820" cy="360" rx="680" ry="140"/>
      </g>
    </svg>
  </div>

  <!-- moon with halo & drift -->
  <div class="moon-wrap" aria-hidden="true">
    <div class="moon"></div>
  </div>

  <!-- stars layer -->
  <div id="starLayer" aria-hidden="true"></div>

  <!-- center login card -->
  <div class="center" role="main">
    <div class="card" role="region" aria-label="Sign in panel">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <h1>Welcome</h1>
          <p class="lead">Sign in to your Moonlit Symphony</p>
        </div>

        <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,#fff7e6,#ffd8a6);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.35)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#fff"></circle></svg>
        </div>
      </div>

      <!-- decorative quill -->
      <div class="quill" aria-hidden="true">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(10,10)">
            <path d="M30 130 C50 110, 120 70, 150 60 C156 58,170 50,170 46 C170 38,152 36,140 40 C132 43,92 70,60 100 C30 128,24 142,30 130 Z" fill="rgba(255,245,230,0.95)"/>
            <path d="M34 134 L36 148 L84 120" stroke="rgba(240,200,150,0.18)" stroke-width="4" stroke-linecap="round" />
          </g>
        </svg>
      </div>

      <!-- email -->
      <div class="field" style="margin-top:14px">
        <label class="label">Email</label>
        <input id="email" class="real-input" autocomplete="username" aria-label="Email" />
        <div class="ink-display" id="ink-email"><span class="caret"></span></div>
      </div>

      <!-- password -->
      <div class="field">
        <label class="label">Password</label>
        <input id="password" class="real-input" type="password" autocomplete="current-password" aria-label="Password" />
        <div class="ink-display" id="ink-pass"><span class="caret"></span></div>
      </div>

      <div class="actions">
        <button class="btn" id="submitBtn" aria-live="polite">Sign in</button>
        <button class="btn ghost" id="demoBtn">Demo</button>
      </div>
    </div>
  </div>

  <!-- particles canvas (typing dust) -->
  <canvas id="particles" class="particles"></canvas>

  <!-- water canvas (ripples) -->
  <canvas id="water"></canvas>

  <!-- moonbeam success -->
  <div class="moonbeam" id="moonbeam" aria-hidden="true"><div class="beam"></div></div>

<script>
  /***********************
   * Helper & sizing
   ***********************/
  const DPR = Math.max(1, window.devicePixelRatio || 1);

  /* Star field */
  (function makeStars(){
    const layer = document.getElementById('starLayer');
    const count = 50;
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = (Math.random()*1.8 + 0.6);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random()*96 + 1) + '%';
      s.style.top = (Math.random()*72 + 2) + '%';
      s.style.opacity = 0.7 + Math.random()*0.6;
      s.style.transform = `scale(${0.8 + Math.random()*0.5})`;
      s.style.transition = `opacity ${0.8 + Math.random()*1.2}s ease-in-out`;
      layer.appendChild(s);
      // twinkle loop
      (function(elem){
        setInterval(()=>{
          elem.style.opacity = 0.4 + Math.random()*0.95;
        }, 600 + Math.random()*1000);
      })(s);
    }
  })();

  /* subtle clouds parallax */
  (function cloudParallax(){
    const cloud = document.getElementById('cloudGroup');
    let t=0;
    function move(){
      t += 0.0008 * (1 + Math.sin(Date.now()*0.0002));
      cloud.setAttribute('transform', `translate(${Math.sin(t)*40},0)`);
      requestAnimationFrame(move);
    }
    move();
  })();

  /* quill element & animation helper */
  const quill = document.querySelector('.quill');
  let quillTimer = null;
  function animateQuill() {
    quill.style.transform = 'translateY(-6px) rotate(-6deg) scale(1.01)';
    if (quillTimer) clearTimeout(quillTimer);
    quillTimer = setTimeout(()=> {
      quill.style.transition = 'transform 520ms cubic-bezier(.2,.8,.2,1)';
      quill.style.transform = 'translateY(0px) rotate(0deg) scale(1)';
      setTimeout(()=> quill.style.transition='',260);
    }, 250);
  }

  /***********************
   * Particles (typing dust)
   ***********************/
  const pCanvas = document.getElementById('particles');
  const pCtx = pCanvas.getContext('2d');
  function resizeParticles(){
    const W = window.innerWidth, H = window.innerHeight;
    pCanvas.width = W * DPR;
    pCanvas.height = H * DPR;
    pCanvas.style.width = W + 'px';
    pCanvas.style.height = H + 'px';
    pCtx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resizeParticles);
  resizeParticles();
  const particles = [];
  function spawnTypingParticles(inputElem){
    const rect = inputElem.getBoundingClientRect();
    const baseX = rect.left + 12 + Math.random()*(rect.width-24);
    const baseY = rect.top + rect.height/2 + (Math.random()*8-4);
    const hueBase = 40 + Math.random()*18;
    for(let i=0;i<8;i++){
      particles.push({
        x: baseX + (Math.random()*20-10),
        y: baseY + (Math.random()*8-4),
        vx: (Math.random()*2-1)*0.9,
        vy: -Math.random()*1.8 - 0.6,
        life: 1.0,
        size: 1 + Math.random()*2.4,
        hue: hueBase + (Math.random()*18-8)
      });
    }
  }
  function drawParticles(){
    pCtx.clearRect(0,0,pCanvas.width, pCanvas.height);
    pCtx.globalCompositeOperation = 'lighter';
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.life -= 0.02;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      pCtx.globalAlpha = Math.min(1, p.life*1.1);
      pCtx.fillStyle = `hsl(${p.hue},85%,68%)`;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      pCtx.fill();
      // gentle glow
      pCtx.fillStyle = `rgba(255,240,200,${p.life*0.06})`;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size*3.2, 0, Math.PI*2);
      pCtx.fill();
    }
    pCtx.globalAlpha = 1;
  }

  /***********************
   * Water ripples
   ***********************/
  const wCanvas = document.getElementById('water');
  const wCtx = wCanvas.getContext('2d');
  function resizeWater(){
    const W = window.innerWidth, H = 160;
    wCanvas.width = W * DPR;
    wCanvas.height = H * DPR;
    wCanvas.style.width = W + 'px';
    wCanvas.style.height = H + 'px';
    wCtx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resizeWater);
  resizeWater();
  const ripples = [];
  function spawnWaterRipple(x, strength=1, maxR=120){
    ripples.push({x, y:70 + Math.random()*20, r:0, maxR: maxR*(0.9+Math.random()*0.4), life:1, strength});
  }

  function drawWater(){
    wCtx.clearRect(0,0,wCanvas.width, wCanvas.height);
    const hh = wCanvas.height / DPR;
    const grad = wCtx.createLinearGradient(0,0,0,hh);
    grad.addColorStop(0, 'rgba(255,255,255,0.02)');
    grad.addColorStop(1, 'rgba(4,8,20,0.62)');
    wCtx.fillStyle = grad;
    wCtx.fillRect(0,0,wCanvas.width/DPR, hh);

    wCtx.globalCompositeOperation = 'lighter';
    for(let i=ripples.length-1;i>=0;i--){
      const s = ripples[i];
      s.r += 1.3 + s.strength*0.45;
      s.life -= 0.008 * s.strength;
      if(s.life <= 0 || s.r > s.maxR){ ripples.splice(i,1); continue;}
      const alpha = Math.max(0, s.life*0.86);
      const grd = wCtx.createRadialGradient(s.x, s.y, s.r*0.08, s.x, s.y, s.r*1.05);
      grd.addColorStop(0, `rgba(255,245,220,${0.06*alpha})`);
      grd.addColorStop(0.6, `rgba(160,190,255,${0.12*alpha})`);
      grd.addColorStop(1, `rgba(160,190,255,0)`);
      wCtx.fillStyle = grd;
      wCtx.beginPath();
      wCtx.arc(s.x, s.y, s.r*1.05, 0, Math.PI*2);
      wCtx.fill();

      wCtx.beginPath();
      wCtx.strokeStyle = `rgba(220,230,255,${0.08*alpha})`;
      wCtx.lineWidth = Math.max(1, 3*alpha);
      wCtx.arc(s.x, s.y, s.r*0.98, 0, Math.PI*2);
      wCtx.stroke();
    }
    wCtx.globalCompositeOperation = 'source-over';
  }

  /***********************
   * Ink display (mirror)
   ***********************/
  function bindInk(inputId, inkId) {
    const inp = document.getElementById(inputId);
    const ink = document.getElementById(inkId);

    function update() {
      const val = inp.value || '';
      if (inp.type === 'password') {
        ink.innerHTML = '<span style="letter-spacing:6px">' + '•'.repeat(val.length) + '</span><span class="caret"></span>';
      } else {
        const escaped = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        ink.innerHTML = `<span>${escaped}</span><span class="caret"></span>`;
      }
    }

    update();
    inp.addEventListener('input', () => {
      update();
      spawnTypingParticles(inp);
      spawnNearbyRipple(inp);
      animateQuill();
    });

    inp.addEventListener('focus', () => {
      const c = ink.querySelector('.caret');
      if(c) c.style.display='inline-block';
    });
    inp.addEventListener('blur', () => {
      const c = ink.querySelector('.caret');
      if(c) c.style.display='none';
    });
  }

  bindInk('email','ink-email');
  bindInk('password','ink-pass');

  function spawnNearbyRipple(inputElem){
    const rect = inputElem.getBoundingClientRect();
    const x = Math.max(20, Math.min(window.innerWidth-20, rect.left + rect.width*0.5 + (Math.random()*40-20)));
    spawnWaterRipple(x, 0.9, 48 + Math.random()*60);
  }

  /***********************
   * Demo & submit
   ***********************/
  const submitBtn = document.getElementById('submitBtn');
  const demoBtn = document.getElementById('demoBtn');
  const moonbeam = document.getElementById('moonbeam');

  submitBtn.addEventListener('click',(e)=>{
    const cx = window.innerWidth*0.5;
    for(let i=0;i<34;i++){
      particles.push({
        x: cx + (Math.random()*120-60),
        y: window.innerHeight*0.45 + (Math.random()*40-20),
        vx: (Math.random()*4-2),
        vy: -Math.random()*3 - 1.2,
        life: 1 + Math.random()*0.8,
        size: 1.8 + Math.random()*2.6,
        hue: 36 + Math.random()*30
      });
    }
    spawnWaterRipple(cx, 2.2, 260);
    // moonbeam success
    moonbeam.style.transition = 'opacity 650ms cubic-bezier(.2,.8,.2,1)';
    moonbeam.style.opacity = '0.94';
    setTimeout(()=> {
      moonbeam.style.transition = 'opacity 900ms ease-out';
      moonbeam.style.opacity = '0';
    }, 1200);
  });

  demoBtn.addEventListener('click', ()=>{
    const sampleEmail = 'you@domain.com';
    const samplePass = 'secret';
    const email = document.getElementById('email');
    const pass = document.getElementById('password');
    email.value=''; pass.value='';
    document.getElementById('ink-email').innerHTML = '<span class="caret"></span>';
    document.getElementById('ink-pass').innerHTML = '<span class="caret"></span>';
    let i=0;
    const t1 = setInterval(()=>{
      email.value = sampleEmail.slice(0, ++i);
      document.getElementById('ink-email').innerHTML = `${email.value}<span class="caret"></span>`;
      spawnTypingParticles(email); spawnNearbyRipple(email);
      animateQuill();
      if(i>=sampleEmail.length){ clearInterval(t1); let j=0;
        const t2 = setInterval(()=>{
          pass.value = samplePass.slice(0, ++j);
          document.getElementById('ink-pass').innerHTML = `${'•'.repeat(pass.value.length)}<span class="caret"></span>`;
          spawnTypingParticles(pass);
          if(j>=samplePass.length){ clearInterval(t2); submitBtn.click(); }
        },110);
      }
    },90);
  });

  /***********************
   * Main loop
   ***********************/
  function loop(){
    drawParticles();
    drawWater();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /***********************
   * Start/resizing
   ***********************/
  function start(){
    resizeParticles();
    resizeWater();
    // gentle cloud motion (tied to requestAnimationFrame)
    (function cloudDrift(){
      const cg = document.getElementById('cloudGroup');
      let t=0;
      function step(){
        t += 0.0006;
        cg.setAttribute('transform', `translate(${Math.sin(t)*36},0)`);
        requestAnimationFrame(step);
      }
      step();
    })();
  }

  start();

  // Ensure canvases sized initially and on resize
  function resizeParticles(){ const W=window.innerWidth, H=window.innerHeight; pCanvas.width=W*DPR; pCanvas.height=H*DPR; pCanvas.style.width=W+'px'; pCanvas.style.height=H+'px'; pCtx.setTransform(DPR,0,0,DPR,0,0); }
  function resizeWater(){ const W=window.innerWidth, H=160; wCanvas.width=W*DPR; wCanvas.height=H*DPR; wCanvas.style.width=W+'px'; wCanvas.style.height=H+'px'; wCtx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize', ()=>{ resizeParticles(); resizeWater(); });

</script>
